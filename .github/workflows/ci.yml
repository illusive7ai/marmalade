name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Toolchain
        run: rustup component add clippy rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  supply-chain:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Advisories, licenses, bans, sources
        run: cargo deny check

  perf:
    # Budgets live in scripts/measure.ps1. Needs a desktop session for the overlay window;
    # non-blocking until we confirm the hosted runner can create it reliably.
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build release
        run: cargo build --release -p overlay-spike
      - name: Measure against budgets
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/measure.ps1 -Enforce
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: perf-report
          path: target/perf-report.json
          if-no-files-found: ignore
