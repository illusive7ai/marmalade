[package]
name = "overlay-spike"
version = "0.0.1"
edition = "2021"
description = "Marmalade overlay spike: measure idle RAM/CPU/wakeups of a native click-through sprite window"
license = "MIT"
publish = false

[dependencies]
marmalade-sprites = { path = "../marmalade-sprites" }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
