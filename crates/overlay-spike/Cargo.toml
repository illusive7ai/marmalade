[package]
name = "overlay-spike"
version = "0.0.1"
edition = "2021"
description = "Marmalade day-one spike: measure idle RAM/CPU of a native click-through cat overlay"
license = "MIT"

[dependencies]
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
